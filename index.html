<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17251d">
  <title>Terrängschack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="brand" href="#"><span>♞</span> TERRÄNGSCHACK</a>
    <nav aria-label="Vy">
      <button class="nav active" data-view="game">Spelare</button>
      <button class="nav" data-view="admin">Admin</button>
    </nav>
    <button class="icon" id="sound" aria-label="Ljud på">◖))</button>
  </header>

  <main>
    <section id="game" class="view active">
      <div class="scorebar">
        <article class="player active-player">
          <img src="img/chesspieces/wikipedia/wK.png" alt="">
          <div><small id="whiteRole">VIT · DU</small><strong id="whiteName">Maja Lind</strong></div>
          <time id="whiteClock">1:27:42</time>
        </article>
        <div class="versus"><span>DRAG 12</span><b>VS</b></div>
        <article class="player black">
          <img src="img/chesspieces/wikipedia/bK.png" alt="">
          <div><small id="blackRole">SVART</small><strong id="blackName">Erik Holm</strong></div>
          <time id="blackClock">1:25:18</time>
        </article>
      </div>

      <div class="game-grid board-only">
        <section class="panel board-panel">
          <div class="panel-head">
            <div><small>STÄLLNING</small><h1>Ditt drag</h1></div>
            <span class="live">● ANSLUTEN</span>
          </div>
          <div id="board" class="board" aria-label="Schackbräde"></div>
          <p class="last-move"><span></span> Senaste drag: <b>… Sf6–e4</b></p>
        </section>

      </div>

      <section class="actions">
        <button id="draw">⚑ &nbsp; Erbjud remi</button>
        <button id="acceptDraw">✓ &nbsp; Acceptera remi</button>
        <button id="declineDraw">× &nbsp; Avslå remi</button>
        <button class="danger" id="resign">⚐ &nbsp; Ge upp</button>
      </section>
    </section>

    <section id="admin" class="view">
      <div class="admin-title"><div><small>PARTILEDNING</small><h1>Skapa schackparti</h1></div><span class="live">● SERVER REDO</span></div>
      <div class="admin-grid">
        <form class="panel setup" id="setup">
          <h2>Spelare</h2>
          <div class="form-grid">
            <label>Vit spelare<input id="wName" value="Maja Lind"></label>
            <label>Svart spelare<input id="bName" value="Erik Holm"></label>
            <label>E-post<input id="wMail" type="email" value="maja@example.se"></label>
            <label>E-post<input id="bMail" type="email" value="erik@example.se"></label>
            <label>Telefon<input id="wPhone" type="tel" value="+46 70 123 45 67"></label>
            <label>Telefon<input id="bPhone" type="tel" value="+46 70 987 65 43"></label>
          </div>
          <hr>
          <h2>Betänketid</h2>
          <div class="form-grid">
            <label>Betänketid<select id="timeControl"><option value="5400,30">90 min + 30 sek/drag</option><option value="3600,30">60 min + 30 sek/drag</option><option value="1800,10">30 min + 10 sek/drag</option></select></label>
          </div>
          <div class="form-actions"><button class="primary" type="submit">Skapa parti</button></div>
        </form>
        <section class="panel preview">
          <div class="panel-head"><div><small>PÅGÅENDE PARTI</small><h2>Maja Lind – Erik Holm</h2></div><span class="live">● ONLINE</span></div>
          <div id="adminBoard" class="board mini-board" aria-label="Aktuell ställning"></div>
          <p>Senaste drag: <b>3. … Sf6–e4</b></p>
        </section>
      </div>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
